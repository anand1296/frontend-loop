name: vercel-repro
on:
  push:
    branches: [how-its-built-and-contribute]
jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: node -v && npm ls vite marked highlight.js react typescript 2>&1 | head -20
      - run: npm run build:web
        env:
          VERCEL: '1'
          CI: '1'
          VERCEL_GIT_COMMIT_SHA: ead15e4306d1b8eca905a8ad72bfe402d32dd169
