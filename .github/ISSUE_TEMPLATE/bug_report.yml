name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - The hosted app (signed in)
        - The single-file / offline build
        - Running locally
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on macOS, Safari on iPhone 15, …
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
