# Local full stack.
#   docker compose up -d db                 # just Postgres, then `npm run dev:api` + `npm run dev`
#   docker compose up --build               # everything: http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frontend_loop
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/frontend_loop?sslmode=disable
      OWNER_GITHUB_LOGIN: ${OWNER_GITHUB_LOGIN:-anand1296}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DEV_LOGIN: ${DEV_LOGIN:-1}
    ports: ['8080:8080']

volumes:
  pgdata:
